name = "pulletsforever-micropub"
main = "src/index.ts"
compatibility_date = "2026-02-18"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[vars]
SITE_URL = "https://pulletsforever.com"
GITHUB_REPO = "davidwkeith/pulletsforever.com"
GITHUB_BRANCH = "main"
BLOG_PATH = "src/posts"
MEDIA_URL = "https://media.pulletsforever.com"
MAX_FILE_SIZE = 10485760  # 10 MB in bytes

# R2 bucket for media uploads
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pulletsforever-media"

# Secrets (set via `wrangler secret put`):
# - GITHUB_TOKEN: GitHub fine-grained personal access token with Contents read/write

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
